

spring.application.name=shivacode-backend

server.port=8081

spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/shivacode
spring.datasource.username=shivacode
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Java code execution
shivacode.runner.image=shivacode-java-runner:latest

shivacode.runner.timeout-seconds=5

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.validation=DEBUG

