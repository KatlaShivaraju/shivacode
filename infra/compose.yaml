
services:
  db:
    image: postgres:17
    container_name: shivacode-db
    environment:
      POSTGRES_DB: shivacode
      POSTGRES_USER: shivacode
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
    ports:
      - "5433:5432"
    volumes:
      - shivacode_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shivacode -d shivacode"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  shivacode_data:

